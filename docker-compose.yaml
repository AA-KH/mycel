# Mycel — Docker Compose
# Author: Kaushal Jindal
# Timezone: Asia/Kolkata (IST, UTC+5:30)

services:
  mongodb:
    image: mongo:latest
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      TZ: Asia/Kolkata

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ""
      TZ: Asia/Kolkata

  # Mycel Backend API (FastAPI)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      TZ: Asia/Kolkata
      # Auth0 Configuration
      VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
      VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
      MONGODB_URL: mongodb://mongodb:27017/mycel
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mycel Frontend (Vite + React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN}
        - VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID}
        - VITE_API_URL=${VITE_API_URL}
        - VITE_HASURA_ENDPOINT=${VITE_HASURA_ENDPOINT}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: Asia/Kolkata
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
